[package]
name = "chronon-coordinator"
version = "0.1.0"
edition = "2021"
description = "Chronon job-admin API (trait, default jobs, typed scheduling)"
license = "MIT"
repository = "https://github.com/unified-field-dev/chronon-coordinator"
publish = false

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
doc_markdown = "allow"
use_self = "allow"
needless_pass_by_value = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
match_wildcard_for_single_variants = "allow"
items_after_statements = "allow"
redundant_clone = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
uninlined_format_args = "allow"
cast_possible_truncation = "allow"
implicit_clone = "allow"
trait_duplication_in_bounds = "allow"
option_option = "allow"
unnecessary_wraps = "allow"
unnecessary_trailing_comma = "allow"
elidable_lifetime_names = "allow"
trivially_copy_pass_by_ref = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
ref_option = "allow"
manual_let_else = "allow"
cognitive_complexity = "allow"
match_same_arms = "allow"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chronon-core = { version = "0.1.4" }
chronon-executor = { version = "0.1.4" }
chronon-scheduler = { version = "0.1.4" }
log = "0.4"
quark = { package = "uf-quark", version = "0.1.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
valence = { package = "uf-valence", version = "0.1.5", default-features = false, features = ["mem"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chronon-coordinator-macros = { git = "https://github.com/unified-field-dev/chronon-coordinator-macros" }
chronon-valence-identity = { git = "https://github.com/unified-field-dev/chronon-valence-identity" }

[[example]]
name = "register_default_jobs_embedded"

[[example]]
name = "script_with_default_job"
